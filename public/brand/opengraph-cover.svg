    </text>
    <text x="16" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Silence is never consent
    </text>
    <text x="16" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Liability permanently NOT_DETERMINED
    </text>
  </g>

  <!-- Bottom Attribution Footer Bar -->
  <rect x="24" y="546" width="1152" height="60" rx="12" fill="#090d16" fill-opacity="0.95" />
  <path d="M 24 546 L 1176 546" stroke="#1e293b" stroke-width="1" />

  <text x="64" y="582" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    Built with AssemblyAI · Universal-3.5 Pro + Voice Agent API
  </text>

  <text x="880" y="582" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12">
    670 Tests Passing · 58 E2E Suites
  </text>
</svg>
