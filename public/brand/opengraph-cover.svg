<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Industrial Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Industrial Subtle Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="300" fill="#f59e0b" fill-opacity="0.06" />
  <circle cx="1050" cy="450" r="350" fill="#38bdf8" fill-opacity="0.05" />

  <!-- Outer Protective Industrial Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Top Telemetry Header Bar -->
  <rect x="24" y="24" width="1152" height="48" rx="16" fill="#0b1120" fill-opacity="0.9" />
  <path d="M 24 72 L 1176 72" stroke="#1e293b" stroke-width="1" />

  <!-- Header Live Indicator & Attribution -->
  <circle cx="56" cy="48" r="5" fill="#10b981" />
  <text x="72" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ASSEMBLYAI VOICE AGENT HACKATHON · PRODUCTION SYSTEM</text>

  <rect x="840" y="36" width="310" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="852" y="52" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="0.5">PO 44891 · GOLDEN DEMO VERIFIED</text>

  <!-- Left Content Column: Logo Mark + Typography -->
  <!-- Logo Mark Graphic Container (Official Submission Mark) -->
  <g transform="translate(72, 120)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#amber-grad)" />
    <g transform="translate(20, 20) scale(2.6667)">
      <path
        d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
        stroke="#080c14"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(196, 120)">
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">DockWitness</text>
    <text x="0" y="92" fill="url(#amber-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">Proof before the truck leaves.</text>
  </g>

  <!-- Core Mission Description -->
  <text x="72" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" width="700">
    A voice-first freight receiving evidence system that captures shortages, overages,
  </text>
  <text x="72" y="305" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    visible damage, and two-party disagreement while the driver is still at the dock door.
  </text>

  <!-- 3 Pillar Feature Cards -->
  <!-- Card 1: Voice Agent & STT -->
  <g transform="translate(72, 350)">
    <rect width="330" height="160" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <text x="26" y="40" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">🎙️</text>
    <text x="64" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">AssemblyAI Speech &amp; Agent</text>
    <text x="64" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">Universal-3.5 Pro · 24kHz Agent</text>

    <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Dedicated AudioWorklet resamplers
    </text>
    <text x="16" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • 6 registered deterministic tools
    </text>
    <text x="16" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Zero-drift DSP &amp; instant barge-in
    </text>
  </g>

  <!-- Card 2: Deterministic Rules Engine -->
  <g transform="translate(432, 350)">
    <rect width="330" height="160" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="26" y="40" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">⚙️</text>
    <text x="64" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Deterministic Engine</text>
    <text x="64" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">Code Calculates · Zero Hallucination</text>

    <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Δ = Observed - Expected in code
    </text>
    <text x="16" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Disputed shortage &amp; damage matrix
    </text>
    <text x="16" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      • Mandatory photo gate for damage
    </text>
  </g>

  <!-- Card 3: Trust & Audit Invariant -->
  <g transform="translate(792, 350)">
    <rect width="336" height="160" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <text x="26" y="40" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">🔒</text>
    <text x="64" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Append-Only Immutability</text>
    <text x="64" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">PostgreSQL Triggers · Full Provenance</text>

    <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
