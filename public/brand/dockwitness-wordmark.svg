<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="wm-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Official Logo Mark (40x40 embedded) -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#wm-amber)" />
    <g transform="translate(8, 8)">
      <path
        d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
        stroke="#080c14"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(54, 28)">
    <text font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#f8fafc">DOCK</tspan>
      <tspan fill="url(#wm-amber)">WITNESS</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(54, 40)">
